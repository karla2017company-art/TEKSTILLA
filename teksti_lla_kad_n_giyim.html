<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEKSTİLLA | تكستيلا للأزياء النسائية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #111;
            color: #fff;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header h1 {
            font-size: 24px;
            letter-spacing: 1px;
            color: #ff4d79;
        }
        .hero {
            background: linear-gradient(135deg, #111, #333);
            color: white;
            text-align: center;
            padding: 60px 20px;
        }
        .hero h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 16px;
            color: #ccc;
        }
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff4d79;
            display: inline-block;
            padding-bottom: 5px;
        }
        #products-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .product-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }
        .product-info {
            padding: 20px;
        }
        .product-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #222;
        }
        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #ff4d79;
            margin-bottom: 15px;
        }
        .buy-btn {
            width: 100%;
            padding: 12px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .buy-btn:hover {
            background: #ff4d79;
        }
        footer {
            background: #111;
            color: #aaa;
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>TEKSTİLLA</h1>
        <p>أزياء نسائية عصرية</p>
    </header>

    <div class="hero">
        <h2>تشكيلة الشتاء والربيع الجديدة</h2>
        <p>اكتبي أسلوبك الخاص بأرقى التصاميم وأفضل الأسعار</p>
    </div>

    <div class="container">
        <h3 class="section-title">أحدث المنتجات</h3>
        <div id="products-container">
            <!-- سيتم تعبئة المنتجات هنا تلقائياً من السيرفر -->
            <p style="text-align: center; grid-column: 1 / -1; color: #777;">جاري تحميل المنتجات...</p>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوضة لمتجر TEKSTİLLA &copy; 2026</p>
    </footer>

    <script>
        // دالة جلب وعرض المنتجات من السيرفر
        async function loadTekstillaProducts() {
            try {
                const response = await fetch('/api/products');
                const data = await response.json();

                const container = document.getElementById('products-container');
                if (!container) return;

                if (data.success && data.products && data.products.length > 0) {
                    container.innerHTML = '';
                    data.products.forEach(product => {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${product.image}" alt="${product.title}">
                            <div class="product-info">
                                <h3>${product.title}</h3>
                                <div class="product-price">${product.price} ${product.currency}</div>
                                <button class="buy-btn" onclick="alert('تمت إضافة المنتج إلى السلة بنجاح!')">أضف للسلة</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #777;">لا توجد منتجات مضافة حالياً.</p>';
                }
            } catch (error) {
                console.error('Error loading products:', error);
                const container = document.getElementById('products-container');
                if (container) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: red;">عذراً، حدث خطأ أثناء تحميل المنتجات.</p>';
                }
            }
        }

        // تشغيل جلب المنتجات بمجرد تحميل الصفحة
        window.addEventListener('DOMContentLoaded', loadTekstillaProducts);
    </script>
</body>
</html>
